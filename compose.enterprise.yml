name: ds-bot-enterprise

x-enterprise-node: &enterprise-node
  image: ds-bot-enterprise-node:local
  pull_policy: never
  build:
    context: .
    dockerfile_inline: |
      FROM node:24-bookworm-slim AS build
      WORKDIR /app
      COPY ds-bot/ /src/ds-bot/
      RUN npm pack /src/ds-bot --pack-destination /tmp --ignore-scripts \
          && npm install --ignore-scripts --no-audit --no-fund --no-package-lock \
             @deepseek-ai/dsh@0.2.2-rc.1 \
          && mkdir -p /app/node_modules/ds-bot \
          && tar -xzf /tmp/ds-bot-*.tgz --strip-components=1 -C /app/node_modules/ds-bot \
          && rm /tmp/ds-bot-*.tgz \
          && test -f /app/node_modules/ds-bot/bin/ds-bot-enterprise-node.mjs
      FROM node:24-bookworm-slim
      COPY --from=build /app/node_modules /app/node_modules
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  working_dir: /home/node
  stop_grace_period: 15s

services:
  dsh:
    image: ds-bot-enterprise-dsh:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DSH_HOST: "127.0.0.1"
      DSH_LISTEN_PORT: "3080"
      DSH_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "--max-time", "2", "http://127.0.0.1:3080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - enterprise-backend
    volumes:
      - enterprise-dsh-data:/data
      - enterprise-dsh-workspace:/workspace
    stop_grace_period: 15s

  employee-pilot:
    profiles: [employee-pilot]
    image: ds-bot-enterprise-dsh:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["node", "/opt/dsh-template/profiles/web/node_modules/ds-bot/bin/ds-bot-enterprise.mjs", "--config", "/run/dsbot-enterprise/config.json"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /home/node
    ports:
      - "127.0.0.1:18443:8443"
    networks:
      - employee-edge
    volumes:
      - type: bind
        source: ${DSBOT_ENTERPRISE_CONFIG_DIR:-/nonexistent/dsbot-enterprise-pilot}
        target: /run/dsbot-enterprise
        read_only: true
        bind:
          create_host_path: false
      # Docker seeds the named volume from the Node image's node-owned home.
      - enterprise-employee-data:/home/node
    stop_grace_period: 15s

  file-policy:
    <<: *enterprise-node
    profiles: [file-policy]
    entrypoint: ["node", "/app/node_modules/ds-bot/bin/ds-bot-enterprise-node.mjs", "policy", "--config", "/app/config/policy.mjs"]
    networks:
      - file-operations
    volumes:
      - type: bind
        source: ${DSBOT_FILE_POLICY_CONFIG_DIR:-/nonexistent/dsbot-file-policy}
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - enterprise-policy-data:/home/node

  worker:
    <<: *enterprise-node
    profiles: [worker]
    entrypoint: ["node", "/app/node_modules/ds-bot/bin/ds-bot-enterprise-node.mjs", "worker", "--config", "/app/config/worker.mjs"]
    networks:
      - file-operations
    volumes:
      - type: bind
        source: ${DSBOT_WORKER_CONFIG_DIR:-/nonexistent/dsbot-worker}
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - enterprise-worker-data:/home/node

networks:
  file-operations:
    internal: true
  employee-edge:
  enterprise-backend:
    internal: true

volumes:
  enterprise-dsh-data:
  enterprise-dsh-workspace:
  enterprise-employee-data:
  enterprise-policy-data:
  enterprise-worker-data:
