<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS Bot · Owner</title>
  <link rel="stylesheet" href="/page.css">
  <script type="module" src="/owner.js"></script>
</head>
<body>
  <main>
    <header><h1>DS Bot · Owner</h1><button id="clear" type="button">Clear credential and results</button></header>
    <section class="card" aria-labelledby="credential-title">
      <h2 id="credential-title">Owner credential</h2>
      <label>Owner token <input id="token" type="password" autocomplete="off" maxlength="43"></label>
    </section>
    <section class="card" aria-labelledby="transcript-title">
      <h2 id="transcript-title">Private transcripts</h2>
      <form id="owner-form" autocomplete="off">
        <label>Employee ID <input id="person" maxlength="128" required></label>
        <label>Bot ID <input id="bot" maxlength="128" required></label>
        <button class="primary">View transcript</button>
      </form>
      <p id="status" role="status"></p>
      <div id="messages" aria-label="Transcript"></div>
      <button id="older" type="button" hidden>Older turns</button>
    </section>
    <section class="card" aria-labelledby="rules-title">
      <h2 id="rules-title">Employee file rules</h2>
      <form id="rule-form" autocomplete="off">
        <label>Change
          <select id="rule-action"><option value="create">Create</option><option value="edit">Edit</option><option value="retire">Retire</option></select>
        </label>
        <label>Rule ID <input id="rule-id" maxlength="256" required></label>
        <fieldset id="rule-fields">
          <label>Employee ID <input id="rule-person" maxlength="256" required></label>
          <label>Bot ID <input id="rule-bot" maxlength="256" required></label>
          <label>Room ID (optional, leave blank for private chat) <input id="rule-room" maxlength="256"></label>
          <label>Directory <input id="rule-directory" maxlength="4096" required></label>
          <label>File operation
            <select id="rule-operation"><option value="read">Read</option><option value="create">Create</option><option value="modify">Modify</option></select>
          </label>
          <label>Effect <select id="rule-effect"><option value="deny">Deny</option><option value="allow">Allow</option></select></label>
          <label>Purpose <textarea id="rule-purpose" maxlength="512" required></textarea></label>
        </fieldset>
        <button id="rule-save" class="primary">Save rule change</button>
      </form>
      <p id="rule-status" role="status"></p>
    </section>
    <section class="card" aria-labelledby="audit-title">
      <h2 id="audit-title">File audit records</h2>
      <form id="audit-form" autocomplete="off">
        <label>Worker node ID <input name="nodeId" maxlength="128" placeholder="Optional for one worker"></label>
        <label>Employee ID <input name="personId" maxlength="256"></label>
        <label>Bot ID <input name="botId" maxlength="256"></label>
        <label>Operation <select name="operation"><option value="">All</option><option value="create">Create</option><option value="read">Read</option><option value="modify">Modify</option></select></label>
        <label>Verdict <select name="verdict"><option value="">All</option><option value="allowed">Allowed</option><option value="denied">Denied</option></select></label>
        <button class="primary">View audit records</button>
      </form>
      <p id="audit-status" role="status"></p>
      <div id="audit-results" hidden>
        <table aria-label="File audit records">
          <thead><tr><th scope="col">Type</th><th scope="col">Employee</th><th scope="col">Bot</th><th scope="col">Operation</th><th scope="col">Rule</th><th scope="col">Version</th><th scope="col">Verdict</th><th scope="col">Outcome</th></tr></thead>
          <tbody id="audit-rows"></tbody>
        </table>
      </div>
      <button id="audit-next" type="button" hidden>Next page</button>
    </section>
  </main>
</body>
</html>
